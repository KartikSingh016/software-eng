<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevFlow — Context-Aware Task Manager for Developers</title>
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --surface-2:#1f2630; --border:#30363d;
  --text:#e6edf3; --text-dim:#8b949e; --accent:#58a6ff;
  --critical:#f85149; --high:#ff9f40; --medium:#58a6ff; --low:#8b949e;
  --radius:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:0 14px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
.brand{font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap;margin:0}
.brand span{color:var(--accent)}
.stats{display:flex;gap:14px}
.stat{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}
.stat b{font-size:14px}
.stat i{font-style:normal;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px}
@media (max-width:1080px){.stat.optional{display:none}}
.spacer{flex:1 1 0;min-width:0}
.field{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 9px;color:var(--text)}
.field::placeholder{color:var(--text-dim)}
.field:focus{border-color:var(--accent);outline:none}
#search{flex:0 1 210px;min-width:110px}
.btn{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 11px;white-space:nowrap}
.btn:hover{background:#2a323d;border-color:#3d4653}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#07101d;font-weight:600}
.btn.danger{border-color:var(--critical);color:var(--critical)}
.btn.sm{padding:3px 8px;font-size:11px}

.main{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) 320px;min-height:0}
@media (max-width:1200px){.main{grid-template-columns:190px minmax(0,1fr) 290px}}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr) 280px}.sidebar{display:none}}

.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.side-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);margin-bottom:6px}
.filter-list{display:flex;flex-direction:column;gap:2px}
.filter-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:var(--radius);padding:5px 8px;text-align:left;width:100%;color:var(--text-dim)}
.filter-item:hover{background:var(--surface-2);color:var(--text)}
.filter-item.active{background:var(--surface-2);border-color:var(--accent);color:var(--text);font-weight:600}
.count{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:0 6px;font-size:10px;color:var(--text-dim);min-width:20px;text-align:center}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.filter-item .label{display:flex;align-items:center;gap:7px;overflow:hidden}

.board{display:flex;gap:12px;padding:12px;overflow-x:auto;min-width:0}
.column{flex:0 0 262px;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.column.dragover{border-color:var(--accent);background:#151d29}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-dim)}
.col-body{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:9px}
.col-empty{color:var(--text-dim);font-size:11px;text-align:center;padding:14px 4px;font-style:italic}

.card{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--medium);border-radius:var(--radius);padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:7px}
.card:hover{background:#242c38}
.card.selected{outline:1px solid var(--accent)}
.card.dragging{opacity:.45}
.card-title{font-weight:600;line-height:1.35;word-break:break-word}
.card-title .key{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text-dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:10px;color:var(--text-dim)}
.icons{display:flex;gap:9px;align-items:center;font-size:10px;color:var(--text-dim)}
.icons .ic{display:flex;align-items:center;gap:3px}
.icons .stale{color:var(--high)}
.bar{height:4px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar.over>span{background:var(--critical)}
.bar-row{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text-dim)}
.bar-row .bar{flex:1}

.rightpanel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.timer{padding:12px;border-bottom:1px solid var(--border);flex:0 0 auto}
.readout{font-family:var(--mono);font-size:38px;font-weight:700;text-align:center;letter-spacing:2px;line-height:1.1}
.readout.flash{animation:flash .5s ease-in-out 3}
@keyframes flash{0%,100%{color:var(--text)}50%{color:var(--accent)}}
.timer-state{text-align:center;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.timer-task{text-align:center;font-size:11px;color:var(--text-dim);margin:5px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-btns{display:flex;gap:6px;justify-content:center;margin-bottom:9px}
.timer-cfg{display:flex;gap:9px;justify-content:center;font-size:10px;color:var(--text-dim)}
.timer-cfg label{display:flex;flex-direction:column;gap:3px;align-items:center}
.timer-cfg input{width:62px;text-align:center;padding:3px 5px}
.inline-msg{font-size:11px;color:var(--high);text-align:center;min-height:15px;margin-bottom:5px}

.detail{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.empty-state{color:var(--text-dim);text-align:center;padding:34px 12px;font-size:12px}
.detail h2{font-size:15px;margin:0;word-break:break-word}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-size:10px;background:var(--bg)}
.section{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 10px}
.section h3{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);margin:0 0 7px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;row-gap:5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:2px 0}
.kv span:first-child{color:var(--text-dim)}
.mono{font-family:var(--mono);font-size:11px;word-break:break-all}
.desc{font-size:12px;color:var(--text-dim);white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:6px;flex-wrap:wrap}
details.snip{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);margin-bottom:6px}
details.snip>summary{cursor:pointer;padding:5px 8px;font-size:11px;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none}
details.snip>summary::-webkit-details-marker{display:none}
details.snip>summary>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.snip pre{margin:0;padding:8px;font-family:var(--mono);font-size:11px;overflow-x:auto;border-top:1px solid var(--border);white-space:pre}
ul.plain{margin:0;padding-left:16px;font-size:11px;color:var(--text-dim);word-break:break-all}
.warn{color:var(--high);font-size:11px}

.backdrop{position:fixed;inset:0;background:rgba(1,4,9,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.backdrop[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:9px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column}
.modal[hidden]{display:none}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:14px}
.x{background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;padding:4px 7px;border-radius:var(--radius)}
.x:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row>label{font-size:11px;color:var(--text-dim)}
.form-row .field{width:100%}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
textarea.field{resize:vertical;min-height:64px}
textarea.code{font-family:var(--mono);min-height:150px;white-space:pre}
.err{color:var(--critical);font-size:11px;min-height:14px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px;font-size:12px;z-index:80;max-width:60vw}
.toast[hidden]{display:none}
.toast.bad{border-color:var(--critical);color:var(--critical)}
.toast.good{border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="brand">Dev<span>Flow</span></h1>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <input id="search" class="field" type="search" placeholder="Search tasks, tags, branches…" aria-label="Search tasks">
    <button class="btn primary" id="btn-new">+ New Task</button>
    <button class="btn" id="btn-export">Export JSON</button>
    <button class="btn" id="btn-import">Import JSON</button>
    <input type="file" id="file-input" accept="application/json,.json" hidden>
  </header>
  <div class="main">
    <aside class="sidebar">
      <div><div class="side-title">Status</div><div class="filter-list" id="filter-status"></div></div>
      <div><div class="side-title">Priority</div><div class="filter-list" id="filter-priority"></div></div>
      <button class="btn" id="btn-clear-filters">Clear filters</button>
    </aside>
    <main class="board" id="board"></main>
    <aside class="rightpanel">
      <section class="timer">
        <div class="readout" id="timer-readout">25:00</div>
        <div class="timer-state" id="timer-state">Idle</div>
        <div class="timer-task" id="timer-task">No task selected</div>
        <div class="inline-msg" id="timer-msg"></div>
        <div class="timer-btns">
          <button class="btn sm" id="btn-timer-start">Start</button>
          <button class="btn sm" id="btn-timer-pause">Pause</button>
          <button class="btn sm" id="btn-timer-stop">Stop</button>
        </div>
        <div class="timer-cfg">
          <label>Work (min)<input class="field" type="number" id="cfg-work" min="1" max="120" value="25"></label>
          <label>Break (min)<input class="field" type="number" id="cfg-break" min="1" max="120" value="5"></label>
        </div>
      </section>
      <section class="detail" id="detail"></section>
    </aside>
  </div>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="modal" id="modal-task" hidden role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
    <div class="modal-head"><h2 id="task-modal-title">New Task</h2><button class="x" data-close aria-label="Close">&#10005;</button></div>
    <div class="modal-body">
      <div class="form-row"><label for="f-title">Title *</label><input class="field" id="f-title" type="text" placeholder="Fix flaky auth test"><div class="err" id="f-title-err"></div></div>
      <div class="form-row"><label for="f-desc">Description</label><textarea class="field" id="f-desc" placeholder="What needs doing?"></textarea></div>
      <div class="form-grid">
        <div class="form-row"><label for="f-priority">Priority</label><select class="field" id="f-priority"></select></div>
        <div class="form-row"><label for="f-status">Status</label><select class="field" id="f-status"></select></div>
        <div class="form-row"><label for="f-tags">Tags (comma-separated)</label><input class="field" id="f-tags" type="text" placeholder="backend, auth"></div>
        <div class="form-row"><label for="f-estimate">Estimate (minutes)</label><input class="field" id="f-estimate" type="number" min="0" step="5" value="0"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="f-submit">Create Task</button></div>
  </div>
  <div class="modal" id="modal-snippet" hidden role="dialog" aria-modal="true" aria-labelledby="snippet-modal-title">
    <div class="modal-head"><h2 id="snippet-modal-title">Attach Code Snippet</h2><button class="x" data-close aria-label="Close">&#10005;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-row"><label for="s-title">Title</label><input class="field" id="s-title" type="text" placeholder="Retry helper"></div>
        <div class="form-row"><label for="s-lang">Language</label><select class="field" id="s-lang">
          <option>JavaScript</option><option>TypeScript</option><option>Python</option><option>Java</option>
          <option>SQL</option><option>Shell</option><option>HTML</option><option>CSS</option><option>Other</option>
        </select></div>
      </div>
      <div class="form-row"><label for="s-code">Code</label><textarea class="field code" id="s-code" spellcheck="false"></textarea><div class="err" id="s-err"></div></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="s-submit">Attach</button></div>
  </div>
  <div class="modal" id="modal-context" hidden role="dialog" aria-modal="true" aria-labelledby="context-modal-title">
    <div class="modal-head"><h2 id="context-modal-title">Capture Context</h2><button class="x" data-close aria-label="Close">&#10005;</button></div>
    <div class="modal-body">
      <div class="form-row"><label for="c-files">Open files (one path per line)</label><textarea class="field code" id="c-files" spellcheck="false" placeholder="src/auth/session.js"></textarea></div>
      <div class="form-row"><label for="c-urls">Reference URLs (one per line)</label><textarea class="field code" id="c-urls" spellcheck="false" placeholder="https://developer.mozilla.org/..."></textarea></div>
      <div class="form-row"><label for="c-notes">Notes</label><textarea class="field" id="c-notes" placeholder="Anything worth remembering"></textarea></div>
      <div class="form-row"><label for="c-hint">Where I left off</label><input class="field" id="c-hint" type="text" placeholder="Video at 41:20; mid-refactor of refreshToken()"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="c-submit">Save Context</button></div>
  </div>
  <div class="modal" id="modal-branch" hidden role="dialog" aria-modal="true" aria-labelledby="branch-modal-title">
    <div class="modal-head"><h2 id="branch-modal-title">Link Git Branch</h2><button class="x" data-close aria-label="Close">&#10005;</button></div>
    <div class="modal-body">
      <div class="form-row"><label for="b-name">Branch name *</label><input class="field" id="b-name" type="text" placeholder="feature/session-refresh"><div class="err" id="b-err"></div></div>
      <div class="form-grid">
        <div class="form-row"><label for="b-repo">Repository</label><input class="field" id="b-repo" type="text" placeholder="acme/api"></div>
        <div class="form-row"><label for="b-base">Base branch</label><input class="field" id="b-base" type="text" value="main"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="b-submit">Link Branch</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';

// ===== PACKAGE 4.1: DOMAIN MODEL =====

const Priority = Object.freeze({ CRITICAL:'critical', HIGH:'high', MEDIUM:'medium', LOW:'low' });
const Status = Object.freeze({ BACKLOG:'backlog', TODO:'todo', IN_PROGRESS:'in-progress', IN_REVIEW:'in-review', DONE:'done' });
const SessionState = Object.freeze({ IDLE:'idle', WORK:'work', BREAK:'break', PAUSED:'paused' });

const STATUS_ORDER = Object.freeze([Status.BACKLOG, Status.TODO, Status.IN_PROGRESS, Status.IN_REVIEW, Status.DONE]);
const PRIORITY_ORDER = Object.freeze([Priority.CRITICAL, Priority.HIGH, Priority.MEDIUM, Priority.LOW]);

const STATUS_LABELS = Object.freeze({
  [Status.BACKLOG]:'Backlog', [Status.TODO]:'To Do', [Status.IN_PROGRESS]:'In Progress',
  [Status.IN_REVIEW]:'In Review', [Status.DONE]:'Done'
});
const PRIORITY_LABELS = Object.freeze({
  [Priority.CRITICAL]:'Critical', [Priority.HIGH]:'High', [Priority.MEDIUM]:'Medium', [Priority.LOW]:'Low'
});

function generateId(prefix='id'){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
}

function formatDuration(minutes){
  const m = Math.max(0, Math.round(Number(minutes)||0));
  if(m===0) return '—';
  const h = Math.floor(m/60), rest = m%60;
  if(h===0) return `${rest}m`;
  if(rest===0) return `${h}h`;
  return `${h}h ${rest}m`;
}

function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatAge(minutes){
  if(minutes<1) return 'just now';
  if(minutes<60) return `${minutes}m ago`;
  if(minutes<1440) return `${Math.floor(minutes/60)}h ago`;
  return `${Math.floor(minutes/1440)}d ago`;
}

/** Parse an untrusted date string, falling back rather than yielding an Invalid Date. */
function safeDate(value, fallback=null){
  if(value==null) return fallback;
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? fallback : d;
}

/** Coerce untrusted input to a finite, non-negative number. */
function nonNegative(value){
  const n = Number(value);
  return Number.isFinite(n) && n>0 ? n : 0;
}

class CodeSnippet {
  constructor(title, language, code){
    this.id = generateId('snip');
    this.title = title;
    this.language = language;
    this.code = code;
    this.createdAt = new Date();
  }
  lineCount(){ return this.code.split('\n').length; }
  preview(maxChars=80){
    const first = this.code.split('\n')[0] || '';
    return first.length>maxChars ? first.slice(0,maxChars)+'…' : first;
  }
  toJSON(){
    return { id:this.id, title:this.title, language:this.language, code:this.code,
             createdAt:this.createdAt.toISOString() };
  }
  static fromJSON(obj){
    const s = new CodeSnippet(obj.title||'', obj.language||'Other', obj.code||'');
    if(obj.id) s.id = obj.id;
    s.createdAt = safeDate(obj.createdAt, s.createdAt);
    return s;
  }
}

class GitBranchLink {
  constructor(branchName, repository='', baseBranch='main'){
    this.branchName = branchName;
    this.repository = repository;
    this.baseBranch = baseBranch;
    this.linkedAt = new Date();
  }
  isFeatureBranch(){
    return this.branchName.startsWith('feature/') || this.branchName.startsWith('feat/');
  }
  suggestedCommitPrefix(taskKey){ return `[${taskKey}] `; }
  toJSON(){
    return { branchName:this.branchName, repository:this.repository,
             baseBranch:this.baseBranch, linkedAt:this.linkedAt.toISOString() };
  }
  static fromJSON(obj){
    const b = new GitBranchLink(obj.branchName||'', obj.repository||'', obj.baseBranch||'main');
    b.linkedAt = safeDate(obj.linkedAt, b.linkedAt);
    return b;
  }
}

class ContextSnapshot {
  constructor(openFiles=[], referenceUrls=[], notes='', cursorHint=''){
    this.id = generateId('ctx');
    this.openFiles = openFiles;
    this.referenceUrls = referenceUrls;
    this.notes = notes;
    this.cursorHint = cursorHint;
    this.capturedAt = new Date();
  }
  isEmpty(){
    return this.openFiles.length===0 && this.referenceUrls.length===0 && this.notes.trim()==='';
  }
  itemCount(){ return this.openFiles.length + this.referenceUrls.length; }
  ageInMinutes(){ return Math.floor((Date.now()-this.capturedAt.getTime())/60000); }
  summary(){
    const f=this.openFiles.length, u=this.referenceUrls.length;
    return `${f} file${f===1?'':'s'}, ${u} link${u===1?'':'s'} · captured ${formatAge(this.ageInMinutes())}`;
  }
  toJSON(){
    return { id:this.id, openFiles:this.openFiles.slice(), referenceUrls:this.referenceUrls.slice(),
             notes:this.notes, cursorHint:this.cursorHint, capturedAt:this.capturedAt.toISOString() };
  }
  static fromJSON(obj){
    const c = new ContextSnapshot(
      Array.isArray(obj.openFiles)?obj.openFiles.filter(x=>typeof x==='string'):[],
      Array.isArray(obj.referenceUrls)?obj.referenceUrls.filter(x=>typeof x==='string'):[],
      obj.notes||'', obj.cursorHint||''
    );
    if(obj.id) c.id = obj.id;
    c.capturedAt = safeDate(obj.capturedAt, c.capturedAt);
    return c;
  }
}

class PomodoroSession {
  constructor(taskId, plannedMinutes, kind='work'){
    this.id = generateId('pom');
    this.taskId = taskId;
    this.startedAt = new Date();
    this.endedAt = null;
    this.plannedMinutes = plannedMinutes;
    this.completed = false;
    this.kind = kind;
    // Active time is accumulated explicitly rather than derived from
    // startedAt..endedAt, so paused intervals are never credited as work.
    this.accumulatedMs = 0;
    this.lastResumedAt = Date.now();
  }
  suspendAccounting(){
    if(this.lastResumedAt===null) return;
    this.accumulatedMs += Date.now()-this.lastResumedAt;
    this.lastResumedAt = null;
  }
  resumeAccounting(){
    if(this.lastResumedAt===null) this.lastResumedAt = Date.now();
  }
  activeMs(){
    return this.accumulatedMs + (this.lastResumedAt===null ? 0 : Date.now()-this.lastResumedAt);
  }
  finish(completed){
    this.suspendAccounting();
    this.endedAt = new Date();
    this.completed = Boolean(completed);
  }
  actualMinutes(){
    if(!this.endedAt) return 0;
    if(this.completed) return this.plannedMinutes;
    return Math.round(this.accumulatedMs/60000);
  }
  toJSON(){
    return { id:this.id, taskId:this.taskId, startedAt:this.startedAt.toISOString(),
             endedAt:this.endedAt?this.endedAt.toISOString():null, plannedMinutes:this.plannedMinutes,
             completed:this.completed, kind:this.kind, accumulatedMs:this.accumulatedMs };
  }
  static fromJSON(obj){
    const s = new PomodoroSession(obj.taskId??null, nonNegative(obj.plannedMinutes), obj.kind||'work');
    if(obj.id) s.id = obj.id;
    s.startedAt = safeDate(obj.startedAt, s.startedAt);
    s.endedAt = safeDate(obj.endedAt, null);
    s.completed = Boolean(obj.completed);
    s.accumulatedMs = nonNegative(obj.accumulatedMs);
    s.lastResumedAt = s.endedAt ? null : Date.now();
    return s;
  }
}

class Task {
  constructor({ title, description='', priority=Priority.MEDIUM, status=Status.BACKLOG, tags=[], estimateMinutes=0 }){
    this.id = generateId('task');
    // Short readable handle (DF-1, DF-2 …) assigned by the board on add. The
    // internal id is stable but unreadable; the key is what a developer types
    // into a commit message.
    this.key = null;
    this.title = title;
    this.description = description;
    this.priority = priority;
    this.status = status;
    this.tags = tags;
    this.estimateMinutes = estimateMinutes;
    this.trackedMinutes = 0;
    this.createdAt = new Date();
    this.updatedAt = new Date();
    this.completedAt = null;
    this.branchLink = null;
    this.snippets = [];
    this.contextSnapshot = null;
  }

  update(fields){
    const allowed = ['title','description','priority','status','tags','estimateMinutes'];
    for(const key of allowed){
      if(Object.prototype.hasOwnProperty.call(fields,key)) this[key] = fields[key];
    }
    this.updatedAt = new Date();
    return this;
  }

  moveTo(newStatus){
    if(!STATUS_ORDER.includes(newStatus)) throw new RangeError(`Unknown status: ${newStatus}`);
    if(newStatus===Status.DONE){
      if(this.completedAt===null) this.completedAt = new Date();
    } else {
      this.completedAt = null;
    }
    this.status = newStatus;
    this.updatedAt = new Date();
    return this;
  }

  attachSnippet(snippet){ this.snippets.push(snippet); this.updatedAt = new Date(); return snippet; }
  removeSnippet(snippetId){
    const i = this.snippets.findIndex(s=>s.id===snippetId);
    if(i===-1) return false;
    this.snippets.splice(i,1);
    this.updatedAt = new Date();
    return true;
  }
  linkBranch(link){ this.branchLink = link; this.updatedAt = new Date(); }
  unlinkBranch(){ this.branchLink = null; this.updatedAt = new Date(); }
  saveContext(snapshot){ this.contextSnapshot = snapshot; this.updatedAt = new Date(); }
  clearContext(){ this.contextSnapshot = null; this.updatedAt = new Date(); }
  hasContext(){ return this.contextSnapshot !== null; }

  addTrackedMinutes(minutes){
    if(!Number.isFinite(minutes) || minutes<0) throw new RangeError('Tracked minutes must be a non-negative number');
    this.trackedMinutes += minutes;
    this.updatedAt = new Date();
    return this.trackedMinutes;
  }

  progressRatio(){
    if(!this.estimateMinutes || this.estimateMinutes<=0) return 0;
    return Math.min(1, Math.max(0, this.trackedMinutes/this.estimateMinutes));
  }
  isOverEstimate(){ return this.estimateMinutes>0 && this.trackedMinutes>this.estimateMinutes; }

  matchesQuery(text){
    const q = String(text||'').trim().toLowerCase();
    if(!q) return true;
    const haystack = [this.key||'', this.title, this.description, this.tags.join(' '),
                      this.branchLink?this.branchLink.branchName:''].join(' ').toLowerCase();
    return haystack.includes(q);
  }

  toJSON(){
    return { id:this.id, key:this.key, title:this.title, description:this.description,
             priority:this.priority, status:this.status, tags:this.tags.slice(),
             estimateMinutes:this.estimateMinutes, trackedMinutes:this.trackedMinutes,
             createdAt:this.createdAt.toISOString(), updatedAt:this.updatedAt.toISOString(),
             completedAt:this.completedAt?this.completedAt.toISOString():null,
             branchLink:this.branchLink?this.branchLink.toJSON():null,
             snippets:this.snippets.map(s=>s.toJSON()),
             contextSnapshot:this.contextSnapshot?this.contextSnapshot.toJSON():null };
  }

  static fromJSON(obj){
    if(!obj || typeof obj!=='object') throw new Error('Task entry is not an object');
    if(typeof obj.title!=='string' || obj.title.trim()==='') throw new Error('Task entry is missing a title');
    const t = new Task({
      title: obj.title,
      description: obj.description||'',
      priority: PRIORITY_ORDER.includes(obj.priority)?obj.priority:Priority.MEDIUM,
      status: STATUS_ORDER.includes(obj.status)?obj.status:Status.BACKLOG,
      tags: Array.isArray(obj.tags)?obj.tags.filter(x=>typeof x==='string'):[],
      estimateMinutes: nonNegative(obj.estimateMinutes)
    });
    if(obj.id) t.id = obj.id;
    if(typeof obj.key==='string' && obj.key) t.key = obj.key;
    t.trackedMinutes = nonNegative(obj.trackedMinutes);
    t.createdAt = safeDate(obj.createdAt, t.createdAt);
    t.updatedAt = safeDate(obj.updatedAt, t.updatedAt);
    t.completedAt = safeDate(obj.completedAt, null);
    t.branchLink = obj.branchLink ? GitBranchLink.fromJSON(obj.branchLink) : null;
    t.snippets = Array.isArray(obj.snippets) ? obj.snippets.map(CodeSnippet.fromJSON) : [];
    t.contextSnapshot = obj.contextSnapshot ? ContextSnapshot.fromJSON(obj.contextSnapshot) : null;
    return t;
  }
}

// ===== PACKAGE 4.2: TASK MANAGEMENT =====

class TaskBoard {
  constructor(){
    this.tasks = [];
    this.filters = { status:null, priority:null, query:'' };
    this.keyPrefix = 'DF';
    this.nextKeyNumber = 1;
  }

  addTask(task){
    if(!task.key) task.key = this.issueKey();
    this.tasks.push(task);
    return task;
  }

  /** Allocate the next sequential task key, e.g. DF-7. */
  issueKey(){ return `${this.keyPrefix}-${this.nextKeyNumber++}`; }

  /**
   * After a bulk load, advance the counter past every key already in use so
   * that newly created tasks cannot collide with imported ones.
   */
  reconcileKeys(){
    let highest = 0;
    const pattern = new RegExp(`^${this.keyPrefix}-(\\d+)$`);
    for(const task of this.tasks){
      const match = task.key && pattern.exec(task.key);
      if(match) highest = Math.max(highest, Number(match[1]));
    }
    this.nextKeyNumber = highest+1;
    for(const task of this.tasks){ if(!task.key) task.key = this.issueKey(); }
  }

  removeTask(taskId){
    const i = this.tasks.findIndex(t=>t.id===taskId);
    if(i===-1) return false;
    this.tasks.splice(i,1);
    return true;
  }

  getTask(taskId){ return this.tasks.find(t=>t.id===taskId); }

  moveTask(taskId, newStatus){
    const task = this.getTask(taskId);
    if(!task) return false;
    task.moveTo(newStatus);
    return true;
  }

  sortTasks(tasks){
    return tasks.slice().sort((a,b)=>{
      const p = PRIORITY_ORDER.indexOf(a.priority)-PRIORITY_ORDER.indexOf(b.priority);
      if(p!==0) return p;
      return b.createdAt.getTime()-a.createdAt.getTime();
    });
  }

  tasksByStatus(status){ return this.sortTasks(this.tasks.filter(t=>t.status===status)); }

  applyFilters(){
    const { status, priority, query } = this.filters;
    return this.tasks.filter(t =>
      (!status || t.status===status) && (!priority || t.priority===priority) && t.matchesQuery(query));
  }

  setFilter(kind, value){
    if(!Object.prototype.hasOwnProperty.call(this.filters,kind)) throw new RangeError(`Unknown filter: ${kind}`);
    if(kind==='query') this.filters.query = value||'';
    else this.filters[kind] = value||null;
  }

  clearFilters(){ this.filters = { status:null, priority:null, query:'' }; }

  statistics(){
    const total = this.tasks.length;
    const done = this.tasks.filter(t=>t.status===Status.DONE).length;
    const inProgress = this.tasks.filter(t=>t.status===Status.IN_PROGRESS).length;
    const blocked = this.tasks.filter(t=>t.tags.some(tag=>tag.toLowerCase()==='blocked')).length;
    const totalTracked = this.tasks.reduce((s,t)=>s+t.trackedMinutes,0);
    const totalEstimated = this.tasks.reduce((s,t)=>s+t.estimateMinutes,0);
    return { total, done, inProgress, blocked, totalTracked, totalEstimated,
             completionRate: total===0?0:done/total };
  }

  exportJSON(){
    return JSON.stringify({ app:'DevFlow', version:1, exportedAt:new Date().toISOString(),
                            tasks:this.tasks.map(t=>t.toJSON()) }, null, 2);
  }

  importJSON(jsonString){
    let data;
    try { data = JSON.parse(jsonString); }
    catch(e){ throw new Error(`Import failed: file is not valid JSON (${e.message})`); }
    const raw = Array.isArray(data) ? data : data && data.tasks;
    if(!Array.isArray(raw)) throw new Error('Import failed: expected a "tasks" array at the top level');
    const rehydrated = raw.map((entry,i)=>{
      try { return Task.fromJSON(entry); }
      catch(e){ throw new Error(`Import failed at task #${i+1}: ${e.message}`); }
    });
    this.tasks = rehydrated;
    this.reconcileKeys();
    return this.tasks.length;
  }

  loadSampleData(){
    const mk = (spec, mutate) => { const t = new Task(spec); if(mutate) mutate(t); this.addTask(t); return t; };

    mk({ title:'Refresh token rotation drops concurrent requests',
         description:'Two parallel calls both see an expired token and race to refresh; the loser gets a 401. Needs a single-flight refresh promise.',
         priority:Priority.CRITICAL, status:Status.IN_PROGRESS, tags:['auth','backend','bug'], estimateMinutes:180 },
      t => {
        t.trackedMinutes = 95;
        t.linkBranch(new GitBranchLink('feature/session-refresh','acme/api','main'));
        t.attachSnippet(new CodeSnippet('Single-flight refresh','JavaScript',
          'let inFlight = null;\nasync function refresh() {\n  if (!inFlight) inFlight = doRefresh().finally(() => { inFlight = null; });\n  return inFlight;\n}'));
        t.saveContext(new ContextSnapshot(
          ['src/auth/session.js','src/auth/refresh.js','test/auth/session.test.js'],
          ['https://datatracker.ietf.org/doc/html/rfc6749#section-6','https://acme.atlassian.net/browse/API-412'],
          'Mutex approach works but breaks the logout path — check teardown order.',
          'Mid-refactor of refreshToken(); two tests still red.'));
      });

    mk({ title:'Work through OAuth device-flow talk and apply it',
         description:'Ninety-minute conference talk; implement the device-code path against the staging tenant while following along.',
         priority:Priority.HIGH, status:Status.IN_PROGRESS, tags:['learning','auth'], estimateMinutes:150 },
      t => {

// ===== PACKAGE 4.3: CONTEXT MANAGEMENT =====

class ContextManager {
  splitLines(text){
    return String(text||'').split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  }

  captureContext(task, formData){
    const snapshot = new ContextSnapshot(
      this.splitLines(formData.openFiles),
      this.splitLines(formData.referenceUrls),
      String(formData.notes||'').trim(),
      String(formData.cursorHint||'').trim());
    task.saveContext(snapshot);
    return snapshot;
  }

  restoreContext(task){
    if(!task.hasContext()) return null;
    const c = task.contextSnapshot;
    return { files:c.openFiles.slice(), urls:c.referenceUrls.slice(),
             notes:c.notes, cursorHint:c.cursorHint, age:formatAge(c.ageInMinutes()) };
  }

  clearContext(task){ task.clearContext(); }

  hasStaleContext(task, thresholdMinutes=1440){
    return task.hasContext() && task.contextSnapshot.ageInMinutes()>thresholdMinutes;
  }
}

// ===== PACKAGE 4.4: TIME TRACKING =====

class TimeTracker {
  constructor(taskBoard){
    this.board = taskBoard;
    this.state = SessionState.IDLE;
    this.currentSession = null;
    this.sessions = [];
    this.remainingSeconds = 0;
    this.deadlineAt = 0;
    this.intervalHandle = null;
    this.workMinutes = 25;
    this.breakMinutes = 5;
    this.activeTaskId = null;
    this.onTick = null;
    this.onComplete = null;
  }

  start(taskId, kind='work'){
    if(this.state!==SessionState.IDLE) return false;
    const minutes = kind==='break' ? this.breakMinutes : this.workMinutes;
    this.activeTaskId = taskId;
    this.currentSession = new PomodoroSession(taskId, minutes, kind);
    this.remainingSeconds = minutes*60;
    this.deadlineAt = Date.now()+minutes*60000;
    this.state = kind==='break' ? SessionState.BREAK : SessionState.WORK;
    this.startInterval();
    return true;
  }

  /**
   * The countdown is derived from a wall-clock deadline rather than a
   * decrementing counter, so throttled background tabs and timer drift cannot
   * stretch a session beyond its planned duration.
   */
  startInterval(){
    this.stopInterval();
    this.intervalHandle = setInterval(()=>this.tick(), 1000);
  }

  stopInterval(){
    if(this.intervalHandle!==null){ clearInterval(this.intervalHandle); this.intervalHandle = null; }
  }

  pause(){
    if(this.state!==SessionState.WORK && this.state!==SessionState.BREAK) return false;
    this.stopInterval();
    this.syncRemaining();
    if(this.currentSession) this.currentSession.suspendAccounting();
    this.state = SessionState.PAUSED;
    return true;
  }

  resume(){
    if(this.state!==SessionState.PAUSED || !this.currentSession) return false;
    this.deadlineAt = Date.now()+this.remainingSeconds*1000;
    this.currentSession.resumeAccounting();
    this.state = this.currentSession.kind==='break' ? SessionState.BREAK : SessionState.WORK;
    this.startInterval();
    return true;
  }

  syncRemaining(){
    this.remainingSeconds = Math.max(0, Math.ceil((this.deadlineAt-Date.now())/1000));
    return this.remainingSeconds;
  }

  stop(completed=false){
    this.stopInterval();
    const session = this.currentSession;
    if(session){
      session.finish(completed);
      if(session.kind==='work' && session.taskId){
        const task = this.board.getTask(session.taskId);
        if(task) task.addTrackedMinutes(session.actualMinutes());
      }
      this.sessions.push(session);
    }
    this.currentSession = null;
    this.remainingSeconds = 0;
    this.deadlineAt = 0;
    this.state = SessionState.IDLE;
    return session;
  }

  /** Abandon the running session without crediting time — used when its task disappears. */
  abandon(){
    this.stopInterval();
    this.currentSession = null;
    this.remainingSeconds = 0;
    this.deadlineAt = 0;
    this.activeTaskId = null;
    this.state = SessionState.IDLE;
  }

  tick(){
    if(this.syncRemaining()>0){
      if(this.onTick) this.onTick(this.remainingSeconds);
      return;
    }
    const finishedKind = this.currentSession ? this.currentSession.kind : 'work';
    const taskId = this.activeTaskId;
    const session = this.stop(true);
    if(this.onComplete) this.onComplete(session);
    if(finishedKind==='work') this.start(taskId,'break');
    else this.activeTaskId = null;
    if(this.onTick) this.onTick(this.remainingSeconds);
  }

  configure(workMinutes, breakMinutes){
    const ok = v => Number.isInteger(v) && v>=1 && v<=120;
    if(!ok(workMinutes) || !ok(breakMinutes)) throw new RangeError('Durations must be whole minutes between 1 and 120');
    this.workMinutes = workMinutes;
    this.breakMinutes = breakMinutes;
    return true;
  }

  formatRemaining(){
    const total = Math.max(0,this.remainingSeconds);
    return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
  }

  sessionsForTask(taskId){ return this.sessions.filter(s=>s.taskId===taskId); }

  totalMinutesForTask(taskId){
    return this.sessions.filter(s=>s.taskId===taskId && s.kind==='work' && s.completed)
                        .reduce((sum,s)=>sum+s.actualMinutes(),0);
  }
}

// ===== PACKAGE 4.5: PRESENTATION =====

class UIController {
  constructor(taskBoard, contextManager, timeTracker){
    this.board = taskBoard;
    this.context = contextManager;
    this.tracker = timeTracker;
    this.selectedTaskId = null;
    this.editingTaskId = null;
    this.confirmingDelete = false;
    this.restoredContext = null;
    this.toastHandle = null;
    this.dirty = false;
    this.lastFocused = null;
    this.openModalId = null;
    this.$ = id => document.getElementById(id);
  }

  /** The board lives only in memory, so track unsaved changes for the unload guard. */
  markDirty(){ this.dirty = true; }

  init(){
    this.populateSelects();
    this.bindHeader();
    this.bindSidebar();
    this.bindBoard();
    this.bindTimer();
    this.bindDetail();
    this.bindModals();
    this.tracker.onTick = () => this.renderTimer();
    this.tracker.onComplete = session => this.onSessionComplete(session);
    window.addEventListener('beforeunload', e => {
      if(!this.dirty) return;
      e.preventDefault();
      e.returnValue = '';
    });
    this.render();
  }

  render(){
    this.renderStats(); this.renderSidebar(); this.renderBoard();
    this.renderDetail(); this.renderTimer();
  }

  renderStats(){
    const s = this.board.statistics();
    const cells = [['Total',s.total,false],['In progress',s.inProgress,false],['Done',s.done,false],
                   ['Blocked',s.blocked,true],['Tracked',formatDuration(s.totalTracked),false],
                   ['Complete',`${Math.round(s.completionRate*100)}%`,true]];
    this.$('stats').innerHTML = cells.map(([label,value,optional]) =>
      `<div class="stat${optional?' optional':''}"><b>${escapeHtml(value)}</b><i>${escapeHtml(label)}</i></div>`).join('');
  }

  bindHeader(){
    this.$('search').addEventListener('input', e=>{
      this.board.setFilter('query', e.target.value);
      this.renderBoard(); this.renderSidebar();
    });
    this.$('btn-new').addEventListener('click', ()=>this.openTaskModal(null));
    this.$('btn-export').addEventListener('click', ()=>this.exportFile());
    this.$('btn-import').addEventListener('click', ()=>this.$('file-input').click());
    this.$('file-input').addEventListener('change', e=>this.importFile(e));
  }

  exportFile(){
    const iso = new Date().toISOString().slice(0,10);
    const blob = new Blob([this.board.exportJSON()], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `devflow-export-${iso}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    this.dirty = false;
    this.toast(`Exported ${this.board.tasks.length} tasks`,'good');
  }

  importFile(event){
    const file = event.target.files && event.target.files[0];
    event.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const count = this.board.importJSON(String(reader.result));
        // The replaced board invalidates any running session's task reference.
        this.tracker.abandon();
        this.selectedTaskId = null;
        this.restoredContext = null;
        this.board.clearFilters();
        this.$('search').value = '';
        this.dirty = false;
        this.render();
        this.toast(`Imported ${count} tasks`,'good');
      } catch(err){ this.toast(err.message,'bad'); }
    };
    reader.onerror = () => this.toast('Import failed: could not read the file','bad');
    reader.readAsText(file);
  }

  renderSidebar(){
    // Facet counts: each dimension is counted with the other active filters
    // applied, so a count never promises tasks the board will not show.
    const { priority, query } = this.board.filters;
    const forStatus = this.board.tasks.filter(t=>(!priority||t.priority===priority) && t.matchesQuery(query));
    const forPriority = this.board.tasks.filter(t=>(!this.board.filters.status||t.status===this.board.filters.status) && t.matchesQuery(query));

    const counts = {}; for(const st of STATUS_ORDER) counts[st] = forStatus.filter(t=>t.status===st).length;
    const pCounts = {}; for(const p of PRIORITY_ORDER) pCounts[p] = forPriority.filter(t=>t.priority===p).length;

    const statusItems = [['','All statuses',forStatus.length]].concat(STATUS_ORDER.map(st=>[st,STATUS_LABELS[st],counts[st]]));
    this.$('filter-status').innerHTML = statusItems.map(([value,label,count])=>{
      const active = (this.board.filters.status||'')===value;
      return `<button class="filter-item${active?' active':''}" data-filter="status" data-value="${escapeHtml(value)}">
        <span class="label">${escapeHtml(label)}</span><span class="count">${count}</span></button>`;
    }).join('');

    const priorityItems = [['','All priorities',forPriority.length]].concat(PRIORITY_ORDER.map(p=>[p,PRIORITY_LABELS[p],pCounts[p]]));
    this.$('filter-priority').innerHTML = priorityItems.map(([value,label,count])=>{
      const active = (this.board.filters.priority||'')===value;
      const dot = value ? `<span class="dot" style="background:var(--${value})"></span>` : '';
      return `<button class="filter-item${active?' active':''}" data-filter="priority" data-value="${escapeHtml(value)}">
        <span class="label">${dot}${escapeHtml(label)}</span><span class="count">${count}</span></button>`;
    }).join('');
  }

  bindSidebar(){
    const handler = e => {
      const btn = e.target.closest('.filter-item');
      if(!btn) return;
      this.board.setFilter(btn.dataset.filter, btn.dataset.value);
      this.renderSidebar(); this.renderBoard();
    };
    this.$('filter-status').addEventListener('click', handler);
    this.$('filter-priority').addEventListener('click', handler);
    this.$('btn-clear-filters').addEventListener('click', ()=>{
      this.board.clearFilters();
      this.$('search').value = '';
      this.renderSidebar(); this.renderBoard();
    });
  }

  renderBoard(){
    const visible = this.board.applyFilters();
    this.$('board').innerHTML = STATUS_ORDER.map(status=>{
      const tasks = this.board.sortTasks(visible.filter(t=>t.status===status));
      const cards = tasks.length ? tasks.map(t=>this.cardHtml(t)).join('') : '<div class="col-empty">No tasks</div>';
      return `<section class="column" data-status="${status}" aria-label="${escapeHtml(STATUS_LABELS[status])} (${tasks.length} tasks)">
        <header class="col-head"><span>${escapeHtml(STATUS_LABELS[status])}</span><span class="count">${tasks.length}</span></header>
        <div class="col-body">${cards}</div></section>`;
    }).join('');
  }

  cardHtml(task){
    const tags = task.tags.slice(0,3).map(tag=>`<span class="chip">${escapeHtml(tag)}</span>`).join('');
    const icons = [];
    if(task.branchLink) icons.push(`<span class="ic" title="Linked branch">&#9095; ${escapeHtml(task.branchLink.branchName)}</span>`);
    if(task.snippets.length) icons.push(`<span class="ic" title="Code snippets">&#123;&#125; ${task.snippets.length}</span>`);
    if(task.hasContext()){
      const stale = this.context.hasStaleContext(task);
      icons.push(`<span class="ic${stale?' stale':''}" title="Context snapshot${stale?' (stale)':''}">&#9678; ctx${stale?' !':''}</span>`);
    }
    let bar = '';
    if(task.estimateMinutes>0){
      const pct = Math.round(task.progressRatio()*100);
      bar = `<div class="bar-row"><div class="bar${task.isOverEstimate()?' over':''}"><span style="width:${pct}%"></span></div>
        <span>${escapeHtml(formatDuration(task.trackedMinutes))} / ${escapeHtml(formatDuration(task.estimateMinutes))}</span></div>`;
    }
    const label = `${task.title} — ${PRIORITY_LABELS[task.priority]} priority, ${STATUS_LABELS[task.status]}. `
      + 'Press Enter to open, Alt with Left or Right Arrow to move between columns.';
    return `<article class="card${this.selectedTaskId===task.id?' selected':''}" draggable="true"
        data-task-id="${escapeHtml(task.id)}" style="border-left-color:var(--${task.priority})"
        tabindex="0" role="button" aria-label="${escapeHtml(label)}">
      <div class="card-title">${task.key?`<span class="key">${escapeHtml(task.key)}</span> `:''}${escapeHtml(task.title)}</div>
      ${tags?`<div class="chips">${tags}</div>`:''}
      ${icons.length?`<div class="icons">${icons.join('')}</div>`:''}
      ${bar}</article>`;
  }

  bindBoard(){
    const board = this.$('board');
    board.addEventListener('click', e=>{
      const card = e.target.closest('.card');
      if(card) this.selectTask(card.dataset.taskId);
    });
    board.addEventListener('keydown', e=>{
      const card = e.target.closest('.card');
      if(!card) return;
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); this.selectTask(card.dataset.taskId); return; }
      // Keyboard equivalent of dragging a card between columns; pointer-only
      // drag and drop would otherwise leave the board unusable without a mouse.
      if(e.altKey && (e.key==='ArrowLeft'||e.key==='ArrowRight')){
        e.preventDefault();
        this.moveTaskByKeyboard(card.dataset.taskId, e.key==='ArrowRight'?1:-1);
      }
    });
    board.addEventListener('dragstart', e=>{
      const card = e.target.closest('.card');
      if(!card) return;
      e.dataTransfer.setData('text/plain', card.dataset.taskId);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    board.addEventListener('dragend', e=>{
      const card = e.target.closest('.card');
      if(card) card.classList.remove('dragging');
    });
    board.addEventListener('dragover', e=>{
      const column = e.target.closest('.column');
      if(!column) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      column.classList.add('dragover');
    });
    board.addEventListener('dragleave', e=>{
      const column = e.target.closest('.column');
      if(column && !column.contains(e.relatedTarget)) column.classList.remove('dragover');
    });
    board.addEventListener('drop', e=>{
      const column = e.target.closest('.column');
      if(!column) return;
      e.preventDefault();
      column.classList.remove('dragover');
      const taskId = e.dataTransfer.getData('text/plain');
      const task = this.board.getTask(taskId);
      if(!task || task.status===column.dataset.status) return;
      this.board.moveTask(taskId, column.dataset.status);
      this.markDirty();
      this.render();
    });
  }

  moveTaskByKeyboard(taskId, direction){
    const task = this.board.getTask(taskId);
    if(!task) return;
    const target = STATUS_ORDER.indexOf(task.status)+direction;
    if(target<0 || target>=STATUS_ORDER.length){ this.toast(`Already in ${STATUS_LABELS[task.status]}`); return; }
    const newStatus = STATUS_ORDER[target];
    this.board.moveTask(taskId, newStatus);
    this.markDirty();
    this.render();
    // The board is re-rendered from scratch, so focus must be re-established
    // on the card's new element or the keyboard user loses their place.
    const moved = this.$('board').querySelector(`.card[data-task-id="${CSS.escape(taskId)}"]`);
    if(moved) moved.focus();
    this.toast(`Moved to ${STATUS_LABELS[newStatus]}`);
  }

  selectTask(taskId){
    this.selectedTaskId = taskId;
    this.confirmingDelete = false;
    this.restoredContext = null;
    this.renderBoard(); this.renderDetail(); this.renderTimer();
  }

  selectedTask(){ return this.selectedTaskId ? this.board.getTask(this.selectedTaskId) : undefined; }

  renderTimer(){
    const running = this.tracker.state===SessionState.WORK || this.tracker.state===SessionState.BREAK;
    const paused = this.tracker.state===SessionState.PAUSED;
    const idle = this.tracker.state===SessionState.IDLE;
    const stateLabels = { idle:'Idle', work:'Focus', break:'Break', paused:'Paused' };
    this.$('timer-readout').textContent = idle ? this.padMinutes(this.tracker.workMinutes) : this.tracker.formatRemaining();
    this.$('timer-state').textContent = stateLabels[this.tracker.state];
    const activeTask = this.tracker.activeTaskId ? this.board.getTask(this.tracker.activeTaskId) : null;
    const selected = this.selectedTask();
    this.$('timer-task').textContent = activeTask ? activeTask.title
      : selected ? `Ready: ${selected.title}` : 'No task selected';
    this.$('btn-timer-start').textContent = paused ? 'Resume' : 'Start';
    this.$('btn-timer-start').disabled = running;
    this.$('btn-timer-pause').disabled = !running;
    this.$('btn-timer-stop').disabled = idle;
  }

  padMinutes(minutes){ return `${String(minutes).padStart(2,'0')}:00`; }

  bindTimer(){
    this.$('btn-timer-start').addEventListener('click', ()=>{
      this.timerMessage('');
      if(this.tracker.state===SessionState.PAUSED){ this.tracker.resume(); this.renderTimer(); return; }
      const task = this.selectedTask();
      if(!task){ this.timerMessage('Select a task first to start a focus session.'); return; }
      this.tracker.start(task.id,'work');
      this.renderTimer();
    });
    this.$('btn-timer-pause').addEventListener('click', ()=>{ this.tracker.pause(); this.renderTimer(); });
    this.$('btn-timer-stop').addEventListener('click', ()=>{
      this.tracker.stop(false);
      this.tracker.activeTaskId = null;
      this.markDirty();
      this.render();
    });
    const applyConfig = () => {
      const work = parseInt(this.$('cfg-work').value,10);
      const brk = parseInt(this.$('cfg-break').value,10);
      try { this.tracker.configure(work,brk); this.timerMessage(''); }
      catch(err){
        this.timerMessage(err.message);
        this.$('cfg-work').value = this.tracker.workMinutes;
        this.$('cfg-break').value = this.tracker.breakMinutes;
      }
      this.renderTimer();
    };
    this.$('cfg-work').addEventListener('change', applyConfig);
    this.$('cfg-break').addEventListener('change', applyConfig);
  }

  timerMessage(text){ this.$('timer-msg').textContent = text; }

  onSessionComplete(session){
    const readout = this.$('timer-readout');
    readout.classList.remove('flash');
    void readout.offsetWidth;
    readout.classList.add('flash');
    setTimeout(()=>readout.classList.remove('flash'),1600);
    if(session && session.kind==='work') this.markDirty();
    this.toast(session && session.kind==='work' ? 'Focus session done — break started' : 'Break over','good');
    this.renderStats(); this.renderBoard(); this.renderDetail();
  }

  renderDetail(){
    const task = this.selectedTask();
    const el = this.$('detail');
    if(!task){
      el.innerHTML = '<div class="empty-state">Select a task to see its details, context snapshot, branch link and snippets.</div>';
      return;
    }
    // Preserve transient view state across the re-render.
    const expanded = new Set(Array.from(el.querySelectorAll('details.snip[open]')).map(d=>d.dataset.snippetId));
    const scrollTop = el.scrollTop;
    el.innerHTML = [this.detailHeadHtml(task), this.detailTimeHtml(task), this.detailBranchHtml(task),
                    this.detailContextHtml(task), this.detailSnippetsHtml(task,expanded),
                    this.detailActionsHtml(task)].join('');
    el.scrollTop = scrollTop;
  }

  detailHeadHtml(task){
    return `<div>
      ${task.key?`<div class="mono" style="color:var(--text-dim);margin-bottom:3px">${escapeHtml(task.key)}</div>`:''}
      <h2>${escapeHtml(task.title)}</h2>
      <div class="badges" style="margin-top:7px">
        <span class="badge">${escapeHtml(STATUS_LABELS[task.status])}</span>
        <span class="badge" style="color:var(--${task.priority});border-color:var(--${task.priority})">${escapeHtml(PRIORITY_LABELS[task.priority])}</span>
        ${task.tags.map(t=>`<span class="badge">${escapeHtml(t)}</span>`).join('')}
      </div>
      ${task.description?`<div class="desc" style="margin-top:9px">${escapeHtml(task.description)}</div>`:''}</div>`;
  }

  detailTimeHtml(task){
    const pct = Math.round(task.progressRatio()*100);
    return `<div class="section"><h3>Time</h3>
      <div class="kv"><span>Tracked</span><span>${escapeHtml(formatDuration(task.trackedMinutes))}</span></div>
      <div class="kv"><span>Estimate</span><span>${escapeHtml(formatDuration(task.estimateMinutes))}</span></div>
      ${task.estimateMinutes>0?`<div class="bar${task.isOverEstimate()?' over':''}" style="margin-top:6px"><span style="width:${pct}%"></span></div>`:''}
      ${task.isOverEstimate()?'<div class="warn" style="margin-top:5px">Over estimate</div>':''}
      ${task.completedAt?`<div class="kv"><span>Completed</span><span>${escapeHtml(task.completedAt.toLocaleString())}</span></div>`:''}</div>`;
  }

  detailBranchHtml(task){
    if(!task.branchLink){
      return `<div class="section"><h3>Git branch <button class="btn sm" data-act="link-branch">Link</button></h3>
        <div class="desc">No branch linked.</div></div>`;
    }
    const b = task.branchLink;
    const prefix = b.suggestedCommitPrefix(task.key||task.id);
    return `<div class="section"><h3>Git branch <span class="row">
        <button class="btn sm" data-act="link-branch">Edit</button>
        <button class="btn sm danger" data-act="unlink-branch">Unlink</button></span></h3>
      <div class="kv"><span>Branch</span><span class="mono">${escapeHtml(b.branchName)}</span></div>
      ${b.repository?`<div class="kv"><span>Repository</span><span class="mono">${escapeHtml(b.repository)}</span></div>`:''}
      <div class="kv"><span>Base</span><span class="mono">${escapeHtml(b.baseBranch)}</span></div>
      <div class="kv"><span>Type</span><span>${b.isFeatureBranch()?'Feature branch':'Other'}</span></div>
      <div class="kv" style="align-items:center"><span>Commit prefix</span>
        <span class="row" style="align-items:center"><span class="mono">${escapeHtml(prefix.trim())}</span>
        <button class="btn sm" data-act="copy-prefix" data-prefix="${escapeHtml(prefix)}">Copy</button></span></div></div>`;
  }

  detailContextHtml(task){
    if(!task.hasContext()){
      return `<div class="section"><h3>Context snapshot <button class="btn sm" data-act="capture-context">Capture</button></h3>
        <div class="desc">Nothing captured. Save your open files, links and a "where I left off" note before switching away.</div></div>`;
    }
    const c = task.contextSnapshot;
    const stale = this.context.hasStaleContext(task);
    const r = this.restoredContext;
    const restored = r ? `<div style="margin-top:9px;border-top:1px solid var(--border);padding-top:8px">
      <div class="side-title">Restored (${escapeHtml(r.age)})</div>
      ${r.files.length?`<div class="side-title" style="margin-top:6px">Open files</div><ul class="plain">${r.files.map(f=>`<li class="mono">${escapeHtml(f)}</li>`).join('')}</ul>`:''}
      ${r.urls.length?`<div class="side-title" style="margin-top:6px">Reference URLs</div><ul class="plain">${r.urls.map(u=>`<li class="mono">${escapeHtml(u)}</li>`).join('')}</ul>`:''}
      ${r.notes?`<div class="side-title" style="margin-top:6px">Notes</div><div class="desc">${escapeHtml(r.notes)}</div>`:''}
      ${r.cursorHint?`<div class="side-title" style="margin-top:6px">Left off at</div><div class="desc">${escapeHtml(r.cursorHint)}</div>`:''}
    </div>` : '';
    return `<div class="section"><h3>Context snapshot <span class="row">
        <button class="btn sm" data-act="restore-context">Restore</button>
        <button class="btn sm" data-act="capture-context">Edit</button>
        <button class="btn sm danger" data-act="clear-context">Clear</button></span></h3>
      <div class="desc">${escapeHtml(c.summary())}${stale?' — <b class="warn">stale</b>':''}</div>
      ${c.cursorHint?`<div class="desc" style="margin-top:6px">&ldquo;${escapeHtml(c.cursorHint)}&rdquo;</div>`:''}
      ${restored}</div>`;
  }

  detailSnippetsHtml(task, expanded=new Set()){
    const list = task.snippets.map(s=>`<details class="snip" data-snippet-id="${escapeHtml(s.id)}"${expanded.has(s.id)?' open':''}>
      <summary><span><b>${escapeHtml(s.title||'Untitled')}</b> <span style="color:var(--text-dim)">${escapeHtml(s.language)} · ${s.lineCount()} lines</span></span></summary>
      <pre>${escapeHtml(s.code)}</pre>
      <div class="row" style="padding:7px 8px;border-top:1px solid var(--border)">
        <button class="btn sm danger" data-act="del-snippet" data-snippet-id="${escapeHtml(s.id)}">Remove</button></div>
    </details>`).join('');
    return `<div class="section"><h3>Snippets (${task.snippets.length}) <button class="btn sm" data-act="add-snippet">Attach</button></h3>
      ${list||'<div class="desc">No snippets attached.</div>'}</div>`;
  }

  detailActionsHtml(task){
    if(this.confirmingDelete){
      return `<div class="section"><h3>Delete task</h3>
        <div class="desc">Permanently remove &ldquo;${escapeHtml(task.title)}&rdquo; from the board?</div>
        <div class="row" style="margin-top:8px">
          <button class="btn danger" data-act="delete-confirm">Yes, delete</button>
          <button class="btn" data-act="delete-cancel">Cancel</button></div></div>`;
    }
    return `<div class="row">
      <button class="btn" data-act="edit-task">Edit</button>
      <button class="btn" data-act="start-timer">Start Timer</button>
      <button class="btn danger" data-act="delete-task">Delete</button></div>`;
  }

  bindDetail(){
    this.$('detail').addEventListener('click', e=>{
      const btn = e.target.closest('[data-act]');
      if(!btn) return;
      const task = this.selectedTask();
      if(!task) return;
      const act = btn.dataset.act;
      if(act==='edit-task') this.openTaskModal(task);
      else if(act==='delete-task'){ this.confirmingDelete = true; this.renderDetail(); }
      else if(act==='delete-cancel'){ this.confirmingDelete = false; this.renderDetail(); }
      else if(act==='delete-confirm'){
        // Bank any tracked time before the task ceases to exist, otherwise
        // stop() would look up a task that has already been removed.
        if(this.tracker.activeTaskId===task.id){ this.tracker.stop(false); this.tracker.activeTaskId = null; }
        this.board.removeTask(task.id);
        this.selectedTaskId = null;
        this.confirmingDelete = false;
        this.markDirty();
        this.render();
        this.toast('Task deleted');
      }
      else if(act==='start-timer'){
        this.timerMessage('');
        if(!this.tracker.start(task.id,'work')) this.timerMessage('A session is already running.');
        this.renderTimer();
      }
      else if(act==='link-branch') this.openBranchModal(task);
      else if(act==='unlink-branch'){ task.unlinkBranch(); this.markDirty(); this.render(); }
      else if(act==='copy-prefix') this.copyText(btn.dataset.prefix);
      else if(act==='capture-context') this.openContextModal(task);
      else if(act==='restore-context'){ this.restoredContext = this.context.restoreContext(task); this.renderDetail(); }
      else if(act==='clear-context'){ this.context.clearContext(task); this.restoredContext = null; this.markDirty(); this.render(); }
      else if(act==='add-snippet') this.openSnippetModal(task);
      else if(act==='del-snippet'){ task.removeSnippet(btn.dataset.snippetId); this.markDirty(); this.render(); }
    });
  }

  copyText(text){
    // The Clipboard API needs a secure context, which file:// is not.
    const done = ok => this.toast(ok?`Copied ${text.trim()}`:'Copy failed', ok?'good':'bad');
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(this.copyFallback(text)));
      return;
    }
    done(this.copyFallback(text));
  }

  copyFallback(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
    return ok;
  }

  populateSelects(){
    this.$('f-priority').innerHTML = PRIORITY_ORDER.map(p=>`<option value="${p}">${PRIORITY_LABELS[p]}</option>`).join('');
    this.$('f-status').innerHTML = STATUS_ORDER.map(s=>`<option value="${s}">${STATUS_LABELS[s]}</option>`).join('');
  }

  openModal(id){
    this.lastFocused = document.activeElement;
    for(const m of document.querySelectorAll('.modal')) m.hidden = true;
    this.$(id).hidden = false;
    this.$('backdrop').hidden = false;
    this.openModalId = id;
    const focusable = this.$(id).querySelector('input, textarea, select');
    if(focusable) focusable.focus();
  }

  closeModal(){
    this.$('backdrop').hidden = true;
    for(const m of document.querySelectorAll('.modal')) m.hidden = true;
    this.openModalId = null;
    if(this.lastFocused && document.contains(this.lastFocused)) this.lastFocused.focus();
    this.lastFocused = null;
  }

  /** Confine Tab cycling to the open dialog (WCAG 2.1 focus order). */
  trapFocus(e){
    if(e.key!=='Tab' || !this.openModalId) return;
    const modal = this.$(this.openModalId);
    const items = Array.from(modal.querySelectorAll('button, input:not([hidden]), textarea, select, [href], [tabindex]:not([tabindex="-1"])'))
                       .filter(el=>!el.disabled && el.offsetParent!==null);
    if(items.length===0) return;
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }

  bindModals(){
    this.$('backdrop').addEventListener('click', e=>{
      if(e.target===this.$('backdrop') || e.target.closest('[data-close]')) this.closeModal();
    });
    document.addEventListener('keydown', e=>{
      if(this.$('backdrop').hidden) return;
      if(e.key==='Escape') this.closeModal();
      else this.trapFocus(e);
    });
    // Single-line inputs submit on Enter, matching native form behaviour.
    this.$('backdrop').addEventListener('keydown', e=>{
      if(e.key!=='Enter' || !this.openModalId) return;
      if(e.target.tagName==='TEXTAREA' || e.target.tagName==='BUTTON') return;
      e.preventDefault();
      const submit = this.$(this.openModalId).querySelector('.modal-foot .primary');
      if(submit) submit.click();
    });
    this.$('f-submit').addEventListener('click', ()=>this.submitTaskModal());
    this.$('s-submit').addEventListener('click', ()=>this.submitSnippetModal());
    this.$('c-submit').addEventListener('click', ()=>this.submitContextModal());
    this.$('b-submit').addEventListener('click', ()=>this.submitBranchModal());
  }

  openTaskModal(task){
    this.editingTaskId = task ? task.id : null;
    this.$('task-modal-title').textContent = task ? 'Edit Task' : 'New Task';
    this.$('f-submit').textContent = task ? 'Save Changes' : 'Create Task';
    this.$('f-title').value = task ? task.title : '';
    this.$('f-desc').value = task ? task.description : '';
    this.$('f-priority').value = task ? task.priority : Priority.MEDIUM;
    this.$('f-status').value = task ? task.status : Status.BACKLOG;
    this.$('f-tags').value = task ? task.tags.join(', ') : '';
    this.$('f-estimate').value = task ? task.estimateMinutes : 0;
    this.$('f-title-err').textContent = '';
    this.openModal('modal-task');
  }

  submitTaskModal(){
    const title = this.$('f-title').value.trim();
    if(!title){ this.$('f-title-err').textContent = 'Title is required.'; this.$('f-title').focus(); return; }
    const fields = {
      title,
      description: this.$('f-desc').value.trim(),
      priority: this.$('f-priority').value,
      tags: this.$('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      estimateMinutes: Math.max(0, parseInt(this.$('f-estimate').value,10)||0)
    };
    const status = this.$('f-status').value;
    const existing = this.editingTaskId ? this.board.getTask(this.editingTaskId) : null;
    if(existing){
      existing.update(fields);
      if(existing.status!==status) existing.moveTo(status);
    } else {
      const task = this.board.addTask(new Task(Object.assign({ status }, fields)));
      if(status===Status.DONE) task.moveTo(Status.DONE);
      this.selectedTaskId = task.id;
    }
    this.markDirty();
    this.closeModal();
    this.render();
  }

  openSnippetModal(task){
    this.editingTaskId = task.id;
    this.$('s-title').value = ''; this.$('s-lang').value = 'JavaScript';
    this.$('s-code').value = ''; this.$('s-err').textContent = '';
    this.openModal('modal-snippet');
  }

  submitSnippetModal(){
    const task = this.board.getTask(this.editingTaskId);
    const codeText = this.$('s-code').value;
    if(!task) return this.closeModal();
    if(!codeText.trim()){ this.$('s-err').textContent = 'Code cannot be empty.'; return; }
    task.attachSnippet(new CodeSnippet(this.$('s-title').value.trim()||'Untitled', this.$('s-lang').value, codeText));
    this.markDirty();
    this.closeModal();
    this.render();
  }

  openContextModal(task){
    this.editingTaskId = task.id;
    const c = task.contextSnapshot;
    this.$('context-modal-title').textContent = c ? 'Edit Context' : 'Capture Context';
    this.$('c-files').value = c ? c.openFiles.join('\n') : '';
    this.$('c-urls').value = c ? c.referenceUrls.join('\n') : '';
    this.$('c-notes').value = c ? c.notes : '';
    this.$('c-hint').value = c ? c.cursorHint : '';
    this.openModal('modal-context');
  }

  submitContextModal(){
    const task = this.board.getTask(this.editingTaskId);
    if(!task) return this.closeModal();
    this.context.captureContext(task, {
      openFiles: this.$('c-files').value, referenceUrls: this.$('c-urls').value,
      notes: this.$('c-notes').value, cursorHint: this.$('c-hint').value });
    this.restoredContext = null;
    this.markDirty();
    this.closeModal();
    this.render();
  }

  openBranchModal(task){
    this.editingTaskId = task.id;
    const b = task.branchLink;
    this.$('b-name').value = b ? b.branchName : '';
    this.$('b-repo').value = b ? b.repository : '';
    this.$('b-base').value = b ? b.baseBranch : 'main';
    this.$('b-err').textContent = '';
    this.openModal('modal-branch');
  }

  submitBranchModal(){
    const task = this.board.getTask(this.editingTaskId);
    if(!task) return this.closeModal();
    const name = this.$('b-name').value.trim();
    if(!name){ this.$('b-err').textContent = 'Branch name is required.'; return; }
    task.linkBranch(new GitBranchLink(name, this.$('b-repo').value.trim(), this.$('b-base').value.trim()||'main'));
    this.markDirty();
    this.closeModal();
    this.render();
  }

  toast(message, kind){
    const el = this.$('toast');
    el.textContent = message;
    el.className = 'toast' + (kind?' '+kind:'');
    el.hidden = false;
    clearTimeout(this.toastHandle);
    this.toastHandle = setTimeout(()=>{ el.hidden = true; }, 3500);
  }
}

// ---- bootstrap ----
const board = new TaskBoard();
const contextManager = new ContextManager();
const timeTracker = new TimeTracker(board);
const ui = new UIController(board, contextManager, timeTracker);
board.loadSampleData();
ui.init();
</script>
